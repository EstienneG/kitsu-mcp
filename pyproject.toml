[project]
name = "kitsu-mcp"
version = "0.1.0"
description = "MCP server for the Kitsu (CGWire) production tracker"
readme = "README.md"
authors = [
    { name = "EstienneG", email = "estienne.goigoux@mistral.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1",
    "gazu>=1.3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
kitsu-mcp = "kitsu_mcp:main"

[project.optional-dependencies]
video = [
    "av>=14",
    "pillow>=11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kitsu-mcp[video]",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
