name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kitsu-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image serves /health behind TLS and refuses without it
        run: |
          docker run -d --name mcp -p 8000:8000 -e KITSU_HOST=https://kitsu.invalid/api -e KITSU_BEHIND_TLS=true kitsu-mcp:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health
          ! docker run --rm -e KITSU_HOST=https://kitsu.invalid/api kitsu-mcp:ci
