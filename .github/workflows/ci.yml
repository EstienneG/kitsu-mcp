name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  zou:
    # Read tools against real Zou versions (the CGWire image bundles Kitsu + Zou), oldest and newest supported.
    name: zou ${{ matrix.zou }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zou: "1.0.43"
            image: cgwire/cgwire:1.0.35-1.0.43-01
          - zou: "1.0.97"
            image: cgwire/cgwire:1.0.73-1.0.97-01
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Start Zou
        run: |
          docker run -d --name zou -p 8090:80 ${{ matrix.image }}
          for i in $(seq 1 150); do curl -fs http://127.0.0.1:8090/api && break; sleep 2; done
          curl -fs http://127.0.0.1:8090/api
      - name: Seed a test production
        run: |
          for i in $(seq 1 10); do uv run python tests/integration/seed.py http://127.0.0.1:8090/api && break; sleep 5; done
      - run: uv run pytest tests/integration -v
        env:
          KITSU_TEST_HOST: http://127.0.0.1:8090/api
          # The container is thrown away after the job: the write tools are tested on it for real.
          KITSU_TEST_WRITES: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kitsu-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image serves /health behind TLS and refuses without it
        run: |
          docker run -d --name mcp -p 8000:8000 -e KITSU_HOST=https://kitsu.invalid/api -e KITSU_BEHIND_TLS=true kitsu-mcp:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health
          ! docker run --rm -e KITSU_HOST=https://kitsu.invalid/api kitsu-mcp:ci
